name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.23.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go version
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./examples/...


  pty-integration:
    name: pty integration (${{ matrix.os }}, Go 1.23)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - name: Verify PTY test module
        working-directory: test/pty
        run: go mod verify
      - name: PTY end-to-end suite
        working-directory: test/pty
        run: go test -count=5 -shuffle=on -timeout=120s ./...
      - name: Vet PTY harness
        working-directory: test/pty
        run: go vet ./...
      - name: PTY race campaign
        if: matrix.os == 'ubuntu-latest'
        working-directory: test/pty
        run: go test -race -count=5 -shuffle=on -timeout=120s ./...

  windows-native-input:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Hammer native console translation and wait semantics
        shell: pwsh
        run: >-
          go test ./internal/engine
          -run 'Test(ConsoleInputEncoder|ConsoleInputRecordABI|DecodeConsoleInputRecordPayloads|NativeSpecialKeySequencesAreComplete|WaitConsoleOrStop)'
          -count=100
          -timeout=120s

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - run: ./scripts/check-coverage.sh 80.0 coverage.out
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.x'
          cache: false
      - run: ./scripts/check-no-external-deps.sh
      - run: ./scripts/check-version.sh
      - run: ./scripts/check-manifest.sh
      - run: go generate ./...
      - run: git diff --exit-code -- api.go

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - run: go test ./internal/inputparser -run='^$' -fuzz=FuzzParserNeverPanics -fuzztime=5s
      - run: go test ./internal/engine -run='^$' -fuzz=FuzzScreenWideCellInvariants -fuzztime=5s
      - run: go test ./internal/engine -run='^$' -fuzz=FuzzLayoutAndRenderInvariants -fuzztime=5s
      - run: go test ./internal/textutil -run='^$' -fuzz=FuzzWrapTextInvariants -fuzztime=5s
      - run: go test ./internal/engine -run='^$' -fuzz=FuzzParseANSIInvariants -fuzztime=5s
